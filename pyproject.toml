[project]
name = "nemsplainer"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Jack Devine", email = "jack.neville.devine@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "altair>=6.3.0",
    "anthropic>=1.15.0",
    "duckdb>=1.4,<2",
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
    "marimo>=0.24.2",
    "nbformat>=5.11.1",
    "openai>=3.35.1",
    "openpyxl>=3.1.5",
    "polars>=2.0.0",
    "python-docx>=1.2.0",
    "python-pptx>=1.0.2",
    "starlette>=1.6.0",
    "urllib3>=2.8.0",
    "uvicorn>=0.53.0",
    "vl-convert-python>=1.9.0.post1",
    "weasyprint>=70.0",
]

[project.scripts]
nemsplainer = "nemsplainer.cli:main"
nemsplainer-chat = "nemsplainer.web:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pdfplumber>=0.11.10",
]
