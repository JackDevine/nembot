<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>nembot — logo options</title>
<style>
  body { margin: 0; padding: 32px; font: 14px/1.5 system-ui, sans-serif; color: #0f172a; background: #f1f5f9; }
  h1 { margin: 0 0 4px; font-size: 22px; }
  p.lead { margin: 0 0 24px; color: #64748b; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(520px, 1fr)); gap: 20px; }
  .card { background: #fff; border: 1px solid #e2e8f0; border-radius: 12px; padding: 18px; }
  .card h2 { margin: 0; font-size: 16px; }
  .card .note { margin: 2px 0 14px; color: #64748b; }
  .row { display: flex; gap: 12px; align-items: stretch; margin-bottom: 12px; }
  .tile { flex: 1; display: flex; align-items: center; justify-content: center; border-radius: 10px; padding: 14px; min-height: 60px; }
  .light { background: #fff; border: 1px solid #e2e8f0; }
  .dark { background: #0f172a; color: #e2e8f0; }
  .tile img { display: block; }
  .big img { width: 150px; height: 150px; }
  .wordmark { gap: 10px; font-weight: 700; font-size: 26px; letter-spacing: -0.5px; }
  .wordmark img { width: 44px; height: 44px; }
  .sizes { gap: 14px; }
  .sizes img { image-rendering: auto; }
  .tab { display: flex; align-items: center; gap: 8px; padding: 6px 12px; border-radius: 8px 8px 0 0; font-size: 12px; width: 150px; }
  .tab.light { background: #fff; border-bottom: none; }
  .tab.dark { background: #1e293b; }
  .tabbar { flex: 1; display: flex; gap: 6px; align-items: flex-end; padding: 8px 8px 0; border-radius: 10px; background: #cbd5e1; }
  .tabbar.dark-bar { background: #020617; }
  .buttons { display: flex; gap: 8px; flex-wrap: wrap; }
  button { font: inherit; font-size: 12px; padding: 4px 10px; border: 1px solid #cbd5e1; border-radius: 6px; background: #f8fafc; cursor: pointer; }
  button:hover { background: #e2e8f0; }
  .label { font-size: 11px; color: #94a3b8; text-align: center; margin-top: 4px; }
</style>
</head>
<body>
<h1>nembot — logo &amp; favicon candidates</h1>
<p class="lead">Each option has a full logo (120×120 viewBox) and a simplified favicon (32×32, or 16×16 for the pixel one), shown on light and dark backgrounds and at real favicon sizes.</p>
<div class="grid" id="grid"></div>

<script>
// A classic lightning bolt, about 16 wide and 32 tall, centred on the origin.
const BOLT = 'M3,-16 L-7,2 L-1,2 L-4,16 L8,-4 L2,-4 L8,-16 Z';
const bolt = (x, y, r, s, attrs) =>
  `<path d="${BOLT}" transform="translate(${x} ${y}) rotate(${r}) scale(${s})" ${attrs}/>`;
const svg = (box, body) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${box} ${box}" width="${box}" height="${box}">${body}</svg>`;

// Zig-zag stroke bolt for the line style, tip pointing up (outwards).
const zig = (pts, x, y, r, attrs) =>
  `<polyline points="${pts}" transform="translate(${x} ${y}) rotate(${r})" fill="none" ${attrs}/>`;

function pixelSvg(rows, colors) {
  const paths = {};
  rows.forEach((row, y) => {
    if (row.length !== 16) throw new Error(`pixel row ${y} has ${row.length} cells`);
    [...row].forEach((c, x) => {
      if (colors[c]) paths[c] = (paths[c] || '') + `M${x} ${y}h1v1h-1z`;
    });
  });
  const body = Object.entries(paths)
    .map(([c, d]) => `<path d="${d}" fill="${colors[c]}"/>`).join('');
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">${body}</svg>`;
}

const PIXEL = [
  '...Y....Y.....Y.',
  '..YY...YY....YY.',
  '.YY...YY....YY..',
  '..YY...YY....YY.',
  '.YY...YY....YY..',
  '.Y....Y.....Y...',
  '...HHHHHHHHHH...',
  '..HHHHHHHHHHHH..',
  '..HHEEHHHHEEHH..',
  '.HHHEEHHHHEEHHH.',
  '.HHHHHHHHHHHHHH.',
  '..HHHHHHHHHHHH..',
  '..HHHMMMMMMHHH..',
  '..HHHHHHHHHHHH..',
  '...HHHHHHHHHH...',
  '......HHHH......',
];
const pixel = pixelSvg(PIXEL, { Y: '#fbbf24', H: '#1e293b', E: '#22d3ee', M: '#0ea5e9' });

const OPTIONS = [
  {
    key: 'a', name: 'A — Classic bot',
    note: 'Navy rounded head, round cyan eyes, three amber bolts fanning out from the top.',
    logo: svg(120, `
      <rect x="13" y="70" width="12" height="20" rx="4" fill="#334155"/>
      <rect x="95" y="70" width="12" height="20" rx="4" fill="#334155"/>
      <rect x="22" y="52" width="76" height="56" rx="16" fill="#0f172a" stroke="#475569" stroke-width="2"/>
      <circle cx="44" cy="78" r="8" fill="#38bdf8"/><circle cx="76" cy="78" r="8" fill="#38bdf8"/>
      <circle cx="46.5" cy="75.5" r="2.5" fill="#fff"/><circle cx="78.5" cy="75.5" r="2.5" fill="#fff"/>
      <rect x="46" y="94" width="28" height="5" rx="2.5" fill="#38bdf8" opacity=".6"/>
      ${bolt(60, 26, 0, 1.25, 'fill="#f59e0b"')}
      ${bolt(28, 34, -32, 1.05, 'fill="#f59e0b"')}
      ${bolt(92, 34, 32, 1.05, 'fill="#f59e0b"')}`),
    favicon: svg(32, `
      <rect x="4" y="15" width="24" height="16" rx="5" fill="#0f172a" stroke="#475569" stroke-width="1"/>
      <circle cx="11.5" cy="23" r="3" fill="#38bdf8"/><circle cx="20.5" cy="23" r="3" fill="#38bdf8"/>
      ${bolt(16, 7.5, 0, 0.42, 'fill="#f59e0b"')}
      ${bolt(6.5, 9, -32, 0.36, 'fill="#f59e0b"')}
      ${bolt(25.5, 9, 32, 0.36, 'fill="#f59e0b"')}`),
  },
  {
    key: 'g', name: 'G — A with D’s grey body',
    note: 'Option A’s layout and colours, with the head filled with option D’s slate gradient.',
    logo: svg(120, `
      <defs><linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="0" y1="52" x2="0" y2="108"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
      <rect x="13" y="70" width="12" height="20" rx="4" fill="#334155"/>
      <rect x="95" y="70" width="12" height="20" rx="4" fill="#334155"/>
      <rect x="22" y="52" width="76" height="56" rx="16" fill="url(#gh)" stroke="#475569" stroke-width="2"/>
      <circle cx="44" cy="78" r="8" fill="#38bdf8"/><circle cx="76" cy="78" r="8" fill="#38bdf8"/>
      <circle cx="46.5" cy="75.5" r="2.5" fill="#fff"/><circle cx="78.5" cy="75.5" r="2.5" fill="#fff"/>
      <rect x="46" y="94" width="28" height="5" rx="2.5" fill="#38bdf8" opacity=".6"/>
      ${bolt(60, 26, 0, 1.25, 'fill="#f59e0b"')}
      ${bolt(28, 34, -32, 1.05, 'fill="#f59e0b"')}
      ${bolt(92, 34, 32, 1.05, 'fill="#f59e0b"')}`),
    favicon: svg(32, `
      <defs><linearGradient id="gh" gradientUnits="userSpaceOnUse" x1="0" y1="15" x2="0" y2="31"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient></defs>
      <rect x="4" y="15" width="24" height="16" rx="5" fill="url(#gh)" stroke="#475569" stroke-width="1"/>
      <circle cx="11.5" cy="23" r="3" fill="#38bdf8"/><circle cx="20.5" cy="23" r="3" fill="#38bdf8"/>
      ${bolt(16, 7.5, 0, 0.42, 'fill="#f59e0b"')}
      ${bolt(6.5, 9, -32, 0.36, 'fill="#f59e0b"')}
      ${bolt(25.5, 9, 32, 0.36, 'fill="#f59e0b"')}`),
  },
  {
    key: 'b', name: 'B — Line icon',
    note: 'Outlined head with a light fill (works on both backgrounds); bolts are rounded zig-zag strokes.',
    logo: svg(120, `
      <rect x="24" y="54" width="72" height="52" rx="14" fill="#f8fafc" stroke="#1e293b" stroke-width="7"/>
      <circle cx="46" cy="78" r="6" fill="#1e293b"/><circle cx="74" cy="78" r="6" fill="#1e293b"/>
      <line x1="50" y1="94" x2="70" y2="94" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>
      ${[[38, 47, -30], [60, 45, 0], [82, 47, 30]].map(([x, y, r]) => zig('0,0 -6,-10 6,-15 0,-30', x, y, r,
        'stroke="#f59e0b" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"')).join('')}`),
    favicon: svg(32, `
      <rect x="5" y="15.5" width="22" height="14.5" rx="4" fill="#f8fafc" stroke="#1e293b" stroke-width="2.5"/>
      <circle cx="12" cy="22.5" r="2" fill="#1e293b"/><circle cx="20" cy="22.5" r="2" fill="#1e293b"/>
      ${[[9.5, 13, -30], [16, 12.5, 0], [22.5, 13, 30]].map(([x, y, r]) => zig('0,0 -2,-4 2,-6 0,-11', x, y, r,
        'stroke="#f59e0b" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"')).join('')}`),
  },
  {
    key: 'c', name: 'C — App badge',
    note: 'Blue circle (the app’s accent #0880ea) with a white bot and yellow bolts. Reads well as a favicon.',
    logo: svg(120, `
      <circle cx="60" cy="60" r="58" fill="#0880ea"/>
      <rect x="24" y="70" width="8" height="16" rx="3" fill="#fff"/>
      <rect x="88" y="70" width="8" height="16" rx="3" fill="#fff"/>
      <rect x="30" y="58" width="60" height="40" rx="11" fill="#fff"/>
      <circle cx="47" cy="77" r="6" fill="#0f172a"/><circle cx="73" cy="77" r="6" fill="#0f172a"/>
      <rect x="50" y="88" width="20" height="4" rx="2" fill="#0880ea"/>
      ${bolt(60, 34, 0, 0.95, 'fill="#facc15"')}
      ${bolt(36, 42, -35, 0.8, 'fill="#facc15"')}
      ${bolt(84, 42, 35, 0.8, 'fill="#facc15"')}`),
    favicon: svg(32, `
      <circle cx="16" cy="16" r="16" fill="#0880ea"/>
      <rect x="7.5" y="15" width="17" height="11.5" rx="3" fill="#fff"/>
      <circle cx="12.5" cy="20.5" r="2" fill="#0f172a"/><circle cx="19.5" cy="20.5" r="2" fill="#0f172a"/>
      ${bolt(16, 8.5, 0, 0.3, 'fill="#facc15"')}
      ${bolt(9.5, 10, -35, 0.26, 'fill="#facc15"')}
      ${bolt(22.5, 10, 35, 0.26, 'fill="#facc15"')}`),
  },
  {
    key: 'd', name: 'D — Visor bot',
    note: 'Slate gradient head with a dark visor and glowing cyan eyes; bolts graded yellow→orange.',
    logo: svg(120, `
      <defs>
        <linearGradient id="dh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
        <linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f97316"/></linearGradient>
        <filter id="dg" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="2"/><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter>
      </defs>
      <circle cx="21" cy="79" r="8" fill="#475569"/><circle cx="99" cy="79" r="8" fill="#475569"/>
      <rect x="22" y="50" width="76" height="58" rx="20" fill="url(#dh)"/>
      <rect x="30" y="64" width="60" height="24" rx="12" fill="#0b1120"/>
      <rect x="40" y="71" width="12" height="10" rx="5" fill="#22d3ee" filter="url(#dg)"/>
      <rect x="68" y="71" width="12" height="10" rx="5" fill="#22d3ee" filter="url(#dg)"/>
      <rect x="52" y="96" width="16" height="4" rx="2" fill="#22d3ee" opacity=".5"/>
      ${bolt(60, 25, 0, 1.2, 'fill="url(#db)"')}
      ${bolt(29, 33, -30, 1.0, 'fill="url(#db)"')}
      ${bolt(91, 33, 30, 1.0, 'fill="url(#db)"')}`),
    favicon: svg(32, `
      <defs>
        <linearGradient id="dh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#64748b"/><stop offset="1" stop-color="#1e293b"/></linearGradient>
        <linearGradient id="db" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fde047"/><stop offset="1" stop-color="#f97316"/></linearGradient>
      </defs>
      <rect x="3" y="14" width="26" height="17" rx="6" fill="url(#dh)"/>
      <rect x="6" y="18" width="20" height="8" rx="4" fill="#0b1120"/>
      <rect x="9.5" y="20" width="4" height="4" rx="2" fill="#22d3ee"/>
      <rect x="18.5" y="20" width="4" height="4" rx="2" fill="#22d3ee"/>
      ${bolt(16, 7, 0, 0.4, 'fill="url(#db)"')}
      ${bolt(6.5, 8.5, -30, 0.34, 'fill="url(#db)"')}
      ${bolt(25.5, 8.5, 30, 0.34, 'fill="url(#db)"')}`),
  },
  {
    key: 'e', name: 'E — Pixel bot',
    note: 'A 16×16 pixel-art bot. The same file is pixel-perfect as a 16px favicon and scales crisply for the logo.',
    logo: pixel,
    favicon: pixel,
  },
  {
    key: 'f', name: 'F — Green & gold',
    note: 'Australian green and gold: a domed head with a smile; gold bolts outlined in dark green.',
    logo: svg(120, `
      <path d="M26,76 A34,34 0 0 1 94,76 V102 Q94,110 86,110 H34 Q26,110 26,102 Z" fill="#00843d"/>
      <circle cx="46" cy="80" r="7" fill="#ffcd00"/><circle cx="74" cy="80" r="7" fill="#ffcd00"/>
      <path d="M48,95 Q60,104 72,95" fill="none" stroke="#ffcd00" stroke-width="4.5" stroke-linecap="round"/>
      ${bolt(60, 20, 0, 1.0, 'fill="#ffcd00" stroke="#00602c" stroke-width="2.5" stroke-linejoin="round"')}
      ${bolt(30, 30, -40, 0.85, 'fill="#ffcd00" stroke="#00602c" stroke-width="2.8" stroke-linejoin="round"')}
      ${bolt(90, 30, 40, 0.85, 'fill="#ffcd00" stroke="#00602c" stroke-width="2.8" stroke-linejoin="round"')}`),
    favicon: svg(32, `
      <path d="M4,22 A12,12 0 0 1 28,22 V28 Q28,31 25,31 H7 Q4,31 4,28 Z" fill="#00843d"/>
      <circle cx="11.5" cy="23" r="2.4" fill="#ffcd00"/><circle cx="20.5" cy="23" r="2.4" fill="#ffcd00"/>
      ${bolt(16, 5, 0, 0.32, 'fill="#ffcd00" stroke="#00602c" stroke-width="3" stroke-linejoin="round"')}
      ${bolt(6, 8, -40, 0.28, 'fill="#ffcd00" stroke="#00602c" stroke-width="3.2" stroke-linejoin="round"')}
      ${bolt(26, 8, 40, 0.28, 'fill="#ffcd00" stroke="#00602c" stroke-width="3.2" stroke-linejoin="round"')}`),
  },
];

// Each preview is an <img> of a data URI, so the SVGs' ids and styles stay isolated.
const uri = s => 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(s.replace(/\s*\n\s*/g, ''));
const img = (s, size) => `<img src="${uri(s)}" width="${size}" height="${size}" alt="">`;

function download(name, text) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([text], { type: 'image/svg+xml' }));
  a.download = name;
  a.click();
  URL.revokeObjectURL(a.href);
}

const grid = document.getElementById('grid');
for (const o of OPTIONS) {
  const card = document.createElement('div');
  card.className = 'card';
  card.innerHTML = `
    <h2>${o.name}</h2>
    <p class="note">${o.note}</p>
    <div class="row">
      <div class="tile light big">${img(o.logo, 150)}</div>
      <div class="tile dark big">${img(o.logo, 150)}</div>
    </div>
    <div class="row">
      <div class="tile light wordmark">${img(o.logo, 44)}nembot</div>
      <div class="tile dark wordmark">${img(o.logo, 44)}nembot</div>
    </div>
    <div class="row">
      ${['light', 'dark'].map(t => `
        <div class="tile ${t} sizes">
          ${[16, 32, 64].map(s => `<div>${img(o.favicon, s)}<div class="label">${s}px</div></div>`).join('')}
        </div>`).join('')}
    </div>
    <div class="row">
      <div class="tabbar"><div class="tab light">${img(o.favicon, 16)}nembot</div></div>
      <div class="tabbar dark-bar"><div class="tab dark">${img(o.favicon, 16)}nembot</div></div>
    </div>
    <div class="buttons">
      <button data-k="logo">Download logo.svg</button>
      <button data-k="favicon">Download favicon.svg</button>
    </div>`;
  card.querySelectorAll('button').forEach(b => b.addEventListener('click', () =>
    download(`nembot-${o.key}-${b.dataset.k}.svg`, o[b.dataset.k].trim() + '\n')));
  grid.appendChild(card);
}
</script>
</body>
</html>
